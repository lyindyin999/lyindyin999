<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="m-bg" x1="0" x2="1">
      <stop offset="0" stop-color="#06080c"/>
      <stop offset="1" stop-color="#08111d"/>
    </linearGradient>
    <linearGradient id="m-bar" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#5f9dff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="16" fill="url(#m-bg)"/>
  <text x="42" y="50" fill="#f4f8ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="3">NOW PLAYING</text>
  <text x="42" y="84" fill="#7f95b4" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="2">SPOTIFY // PRIVATE SESSION</text>
  <text x="42" y="113" fill="#4f6078" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">live sync slot ready</text>

  <g transform="translate(915 37)" fill="url(#m-bar)">
    <rect x="0" y="40" width="10" height="30" rx="5">
      <animate attributeName="y" values="40;16;40" dur=".9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="30;54;30" dur=".9s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="26" width="10" height="44" rx="5">
      <animate attributeName="y" values="26;42;26" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="44;28;44" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="18" width="10" height="52" rx="5">
      <animate attributeName="y" values="18;34;18" dur=".75s" repeatCount="indefinite"/>
      <animate attributeName="height" values="52;36;52" dur=".75s" repeatCount="indefinite"/>
    </rect>
    <rect x="78" y="34" width="10" height="36" rx="5">
      <animate attributeName="y" values="34;12;34" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="height" values="36;58;36" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="104" y="22" width="10" height="48" rx="5">
      <animate attributeName="y" values="22;38;22" dur=".82s" repeatCount="indefinite"/>
      <animate attributeName="height" values="48;32;48" dur=".82s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="31" width="10" height="39" rx="5">
      <animate attributeName="y" values="31;15;31" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="height" values="39;55;39" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>