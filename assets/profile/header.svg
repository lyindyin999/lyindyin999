<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="lineA" x1="0" x2="1">
      <stop offset="0" stop-color="#2f7fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#6aa8ff" stop-opacity=".35"/>
      <stop offset="0.5" stop-color="#2f7fff" stop-opacity=".9"/>
      <stop offset="0.82" stop-color="#8bb8ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f7fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineB" x1="1" x2="0">
      <stop offset="0" stop-color="#4b93ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#83b5ff" stop-opacity=".45"/>
      <stop offset="0.58" stop-color="#377fff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#4b93ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#2f7fff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#75acff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#ffffff"/>

  <!-- subtle white/blue ambient glow -->
  <circle cx="960" cy="128" r="130" fill="url(#blueGlow)" filter="url(#softBlur)">
    <animate attributeName="r" values="110;142;110" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;.8;.45" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- main moving blue orbital lines -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="946" cy="130" rx="215" ry="60" stroke="url(#lineA)" stroke-width="1.6" transform="rotate(-12 946 130)">
      <animateTransform attributeName="transform" type="rotate" from="-12 946 130" to="348 946 130" dur="22s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="946" cy="130" rx="165" ry="42" stroke="url(#lineB)" stroke-width="1.1" opacity=".9" transform="rotate(20 946 130)">
      <animateTransform attributeName="transform" type="rotate" from="20 946 130" to="-340 946 130" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="946" cy="130" rx="118" ry="27" stroke="#4f8fff" stroke-opacity=".32" stroke-width=".8" transform="rotate(-32 946 130)">
      <animateTransform attributeName="transform" type="rotate" from="-32 946 130" to="328 946 130" dur="12s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- moving horizontal energy lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M610 74 C730 44, 850 48, 1010 74 S1150 98, 1210 84"
          stroke="url(#lineA)" stroke-width="1.05" opacity=".68">
      <animateTransform attributeName="transform" type="translate" values="-40 0;30 0;-40 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <path d="M560 182 C720 212, 860 210, 1010 184 S1150 158, 1230 176"
          stroke="url(#lineB)" stroke-width=".9" opacity=".48">
      <animateTransform attributeName="transform" type="translate" values="30 0;-35 0;30 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- anchor points -->
  <circle cx="946" cy="130" r="12" fill="#2f7fff"/>
  <circle cx="946" cy="130" r="20" fill="none" stroke="#7fb0ff" stroke-opacity=".34">
    <animate attributeName="r" values="18;24;18" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".18;.5;.18" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1106" cy="94" r="4" fill="#5b9bff">
    <animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <text x="58" y="105" fill="#183d75"
        font-size="50"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-weight="700"
        letter-spacing="5">9.9CTY</text>

  <text x="61" y="144" fill="#4f75a8"
        font-size="15"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        letter-spacing="4">DESIGN / CODE / AI</text>

  <line x1="61" y1="170" x2="480" y2="170" stroke="#4f8fff" stroke-opacity=".48"/>

  <text x="61" y="199" fill="#7187a5"
        font-size="12"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        letter-spacing="2">CREATIVE SYSTEMS • VISUAL EXPERIMENTS • AUTOMATION</text>
</svg>