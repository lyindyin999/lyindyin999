<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#e4efff"/>
    </linearGradient>

    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#4f8fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#8bb8ff" stop-opacity=".7"/>
      <stop offset="0.7" stop-color="#2f7fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#4f8fff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#4f8fff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#8cbaff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <circle cx="965" cy="120" r="125" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="105;135;105" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;.95;.55" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="url(#line)">
    <ellipse cx="945" cy="130" rx="210" ry="58" stroke-width="1.4" transform="rotate(-12 945 130)">
      <animateTransform attributeName="transform" type="rotate" from="-12 945 130" to="348 945 130" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="945" cy="130" rx="155" ry="40" stroke-width=".9" opacity=".65" transform="rotate(22 945 130)">
      <animateTransform attributeName="transform" type="rotate" from="22 945 130" to="-338 945 130" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <circle cx="945" cy="130" r="14" fill="#2f7fff"/>
  <circle cx="1110" cy="96" r="4" fill="#7fb0ff">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <text x="58" y="105" fill="#173b70" font-size="50" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" letter-spacing="5">9.9CTY</text>

  <text x="61" y="144" fill="#4a73a8" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="4">DESIGN / CODE / AI</text>

  <line x1="61" y1="170" x2="480" y2="170" stroke="#4f8fff" stroke-opacity=".55"/>

  <text x="61" y="199" fill="#6c86a9" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="2">CREATIVE SYSTEMS • VISUAL EXPERIMENTS • AUTOMATION</text>
</svg>