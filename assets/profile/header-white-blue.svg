<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="orbit1" x1="0" x2="1">
      <stop offset="0" stop-color="#9ec5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#9ec5ff" stop-opacity=".55"/>
      <stop offset="0.52" stop-color="#69a8ff" stop-opacity=".95"/>
      <stop offset="0.82" stop-color="#b8d5ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#9ec5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbit2" x1="1" x2="0">
      <stop offset="0" stop-color="#b9d6ff" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#9bc4ff" stop-opacity=".62"/>
      <stop offset="0.62" stop-color="#77afff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b9d6ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#77adff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#b8d5ff" stop-opacity=".055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#ffffff"/>

  <circle cx="958" cy="129" r="132" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="112;143;112" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;.8;.45" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="946" cy="130" rx="215" ry="60" stroke="url(#orbit1)" stroke-width="1.8" transform="rotate(-12 946 130)">
      <animateTransform attributeName="transform" type="rotate" from="-12 946 130" to="348 946 130" dur="22s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="946" cy="130" rx="164" ry="42" stroke="url(#orbit2)" stroke-width="1.25" transform="rotate(20 946 130)">
      <animateTransform attributeName="transform" type="rotate" from="20 946 130" to="-340 946 130" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="946" cy="130" rx="118" ry="27" stroke="#a8cbff" stroke-width=".95" stroke-opacity=".75" transform="rotate(-32 946 130)">
      <animateTransform attributeName="transform" type="rotate" from="-32 946 130" to="328 946 130" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M600 74 C735 43, 860 48, 1015 74 S1150 98, 1220 84"
          stroke="url(#orbit1)" stroke-width="1.15" opacity=".85">
      <animateTransform attributeName="transform" type="translate" values="-42 0;32 0;-42 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <path d="M555 183 C720 211, 865 211, 1010 184 S1150 158, 1230 176"
          stroke="url(#orbit2)" stroke-width="1" opacity=".72">
      <animateTransform attributeName="transform" type="translate" values="32 0;-38 0;32 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="946" cy="130" r="12" fill="#78afff"/>
  <circle cx="946" cy="130" r="20" fill="none" stroke="#b2d1ff" stroke-width="1.2">
    <animate attributeName="r" values="18;25;18" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".35;.85;.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1107" cy="95" r="4" fill="#8dbbff">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <text x="58" y="105" fill="#173b70"
        font-size="50"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-weight="700"
        letter-spacing="5">9.9CTY</text>

  <text x="61" y="144" fill="#4f75a8"
        font-size="15"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        letter-spacing="4">DESIGN / CODE / AI</text>

  <line x1="61" y1="170" x2="480" y2="170" stroke="#8bb8ff" stroke-opacity=".8"/>

  <text x="61" y="199" fill="#7187a5"
        font-size="12"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        letter-spacing="2">CREATIVE SYSTEMS • VISUAL EXPERIMENTS • AUTOMATION</text>
</svg>