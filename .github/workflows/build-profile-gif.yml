name: Build seamless profile GIF

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-profile-gif.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download source GIF
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 \
            "https://media.giphy.com/media/xUPGcvCuJDFgKcNkbe/giphy.gif" \
            -o /tmp/source.gif

      - name: Remove end pause and force infinite loop
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from statistics import median
          from pathlib import Path

          src = Image.open("/tmp/source.gif")
          frames = []
          durations = []

          for i in range(src.n_frames):
              src.seek(i)
              frames.append(src.convert("RGBA").copy())
              durations.append(int(src.info.get("duration", 40) or 40))

          positive = [d for d in durations if d > 0]
          base = int(median(positive)) if positive else 40
          cap = max(50, min(90, int(base * 1.6)))

          # Most GIF pauses are encoded as one abnormally long final frame.
          durations = [max(20, min(d, cap)) for d in durations]

          # Remove exact duplicate frames at the very end, another common
          # way GIFs encode a visible pause before looping.
          while len(frames) > 2:
              a = frames[-1].convert("RGB")
              b = frames[-2].convert("RGB")
              diff = ImageChops.difference(a, b)
              if diff.getbbox() is None:
                  frames.pop()
                  durations.pop()
              else:
                  break

          out = Path("assets/redbull_loop_nopause.gif")
          frames[0].save(
              out,
              save_all=True,
              append_images=frames[1:],
              duration=durations,
              loop=0,
              disposal=2,
              optimize=True,
          )

          print("frames:", len(frames))
          print("original median duration:", base, "ms")
          print("max output duration:", max(durations), "ms")
          print("output:", out, out.stat().st_size, "bytes")
          PY

      - name: Point profile README to local GIF
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          old = "https://media.giphy.com/media/xUPGcvCuJDFgKcNkbe/giphy.gif"
          new = "https://raw.githubusercontent.com/lyindyin999/lyindyin999/main/assets/redbull_loop_nopause.gif"

          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit("Expected GIF reference was not found in README.md")

          path.write_text(text)
          PY

      - name: Commit seamless GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/redbull_loop_nopause.gif
          git commit -m "profile: make GIF loop seamless"
          git push
